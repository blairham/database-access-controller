version: 2

# GoReleaser configuration for database-access-controller
# See: https://goreleaser.com
project_name: database-access-controller

builds:
  # Linux only, and image only.
  - id: manager
    binary: manager
    main: ./cmd/manager
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
  # dbctl plans and applies from a terminal, so it ships for laptops too.
  - id: dbctl
    binary: dbctl
    main: ./cmd/dbctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: dbctl
    ids:
      - dbctl
    formats:
      - tar.gz
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      dbctl_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else }}{{ .Arch }}{{ end }}

# macOS signing and notarization, skipped when the secrets are absent.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - dbctl
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true

# The image the Helm chart pulls. --snapshot never builds the multi-arch index,
# and SBOM attestation is on by default, so it is turned off.
dockers_v2:
  - id: image
    ids:
      - manager
      - dbctl
    images:
      - ghcr.io/blairham/database-access-controller
    dockerfile: Dockerfile
    flags:
      - --target=release
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: false
    # `latest` moves only on a real release, never a prerelease.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: database-access-controller
      org.opencontainers.image.description: Provisions roles, schemas and grants inside RDS and Aurora PostgreSQL
      org.opencontainers.image.url: https://github.com/blairham/database-access-controller
      org.opencontainers.image.source: https://github.com/blairham/database-access-controller
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

checksum:
  name_template: 'checksums.txt'

# Keyless cosign signatures; the identity is blairham/.github's go-release.yml.
# Signing checksums.txt covers every archive. See SECURITY.md to verify.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# Each published image, by digest.
docker_signs:
  - cmd: cosign
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# The release notes are the tag's CHANGELOG.md section, passed by
# blairham/.github's go-release.yml with --release-notes, which replaces this
# generated list; the list is used only for tags from before CHANGELOG.md
# existed. Do not set `changelog.disable`: it also skips the stage that loads
# --release-notes, and the release would go out with empty notes.
changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  draft: false
  replace_existing_draft: true
  # No target_commitish: the tag already exists, and naming a commit makes
  # GitHub treat the release as a ref write. When the release range touches
  # .github/workflows, that needs the workflows permission GITHUB_TOKEN
  # cannot have, and creating the release fails with a 403.
  prerelease: auto
  mode: replace
  footer: |
    **Full Changelog**: https://github.com/blairham/database-access-controller/compare/{{ .PreviousTag }}...{{ .Tag }}
