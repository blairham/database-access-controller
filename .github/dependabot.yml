# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      # aws-sdk-go-v2 releases its modules together; one PR, not six.
      aws-sdk:
        patterns: ["github.com/aws/aws-sdk-go-v2*"]
      # client-go, api and apimachinery must move in lockstep with each other
      # and with controller-runtime; split, they fail to build.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # A Go minor bump moves go.mod and .tool-versions by hand, not as a lone
      # Dockerfile bump. The mirror path makes the name docker/library/golang.
      - dependency-name: docker/library/golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Stay on the PostgreSQL major CI's integration suite uses.
      - dependency-name: docker/library/postgres
        update-types:
          - version-update:semver-major
