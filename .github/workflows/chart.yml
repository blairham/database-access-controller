name: Publish chart

# Publishes charts/database-access-controller to oci://ghcr.io/blairham/charts
# and signs it by digest, via blairham/.github's go-chart.yml, so a consumer
# can `helm install`/`helm template` a pinned version without cloning the
# repository. The image is published by release.yml; this is the chart that
# installs it. It refuses unless both `version` and `appVersion` match the
# tag.
#
# A separate workflow, not a step in release.yml, so a tag that predates it
# (or a push that failed) can be published by hand without re-running a
# release whose GitHub release and image already exist:
#   gh workflow run chart.yml -f tag=v0.0.6
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag whose chart to publish (e.g. v0.0.6). Must already exist."
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Chart
    permissions:
      contents: read
      packages: write # the chart on ghcr.io
      id-token: write # keyless cosign
    uses: blairham/.github/.github/workflows/go-chart.yml@9711060ad4860f35860bcbf90d90f103617082d2 # v0.0.1
    with:
      tag: ${{ inputs.tag }}
      charts: '["database-access-controller"]'
