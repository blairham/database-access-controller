name: ci

# A `v*` tag is what publishes an image; a push to main only validates. The tag
# IS the version, so a deployed ref is always reproducible -- the alternative,
# publishing a moving tag per push, is what makes a rollout silently deploy the
# binary it already had.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth: go.mod. A hardcoded version here drifts
          # from the toolchain the code is actually written against.
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Verify the generated files are current
        # controller-gen owns the CRD and the ClusterRole rules, and
        # hack/sync-chart.sh copies them into the chart. Stale output means the
        # chart asks for permissions the controller does not have, or ships a
        # schema the types no longer match -- both of which fail at runtime
        # rather than in review.
        run: make check-generated

      - name: Format and vet
        run: |
          make fmt vet
          git diff --exit-code || { echo "::error::gofmt made changes; run 'make fmt' and commit"; exit 1; }

      - name: Unit tests
        run: go test ./... -race -coverprofile=cover.out

      - name: Controller tests against a real API server
        # envtest downloads a kube-apiserver and etcd; no cluster, no Docker.
        run: make test-envtest

      - name: Lint and render the chart
        run: make helm-lint

      - name: Build both binaries
        run: make build

  # The integration suite needs a real PostgreSQL, because unit tests cannot
  # tell you whether the generated DDL parses or whether the privilege split is
  # one PostgreSQL accepts.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the generated SQL against PostgreSQL 16
        env:
          PGTEST_DSN: postgres://postgres:test@127.0.0.1:5433/postgres
        run: go test -tags integration ./internal/engine/postgres/ -v

  release:
    # Only a tag publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 as well as amd64: the rigs run on Apple silicon, and an
          # unpinned pod that lands on the other arch cannot pull an image
          # built for one platform.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          # Immutable by construction: the version tag comes off the git tag.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm the chart points at what was just published
        # The chart's appVersion is what an unset image.tag falls back to, so a
        # release whose chart still names the previous version installs the old
        # binary while reporting the new one.
        run: |
          chart_version="$(grep '^appVersion:' charts/database-controller/Chart.yaml | awk '{print $2}' | tr -d '"')"
          if [ "$chart_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Chart.yaml appVersion is $chart_version but the tag is ${{ steps.version.outputs.version }}; bump the chart and re-tag"
            exit 1
          fi
