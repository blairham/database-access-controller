name: CI

# Everything that gates a merge. The jobs themselves — Pre-commit, Detect
# changed files, Build and test, Fuzz — are blairham/.github's go-ci.yml,
# shared with every Go repository there; their checks report as
# `CI / <job>`. The image build is its go-image.yml (`Image / Build image`).
# Repository-specific jobs go below, `needs: changes` (go-changes.yml, so
# they need not wait for all of go-ci), with their steps gated on
# `needs.changes.outputs.code == 'true'` (never a job-level `if:` or a
# `paths:` filter: a required check that never runs is pending forever).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # A squash merge lands a tree no pull request built, so main gets its own run.
    branches: [main]
  schedule:
    # Weekly, for go-ci.yml's Fuzz job, which explores on main and on this
    # schedule but never on a pull request.
    - cron: '41 5 * * 3'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: blairham/.github/.github/workflows/go-ci.yml@9711060ad4860f35860bcbf90d90f103617082d2 # v0.0.1
    with:
      # Both binaries, then the generated files (deepcopy, CRDs, RBAC and the
      # chart's copies) must match what `make generate` writes, and vet must
      # pass under every build tag, not only the untagged build.
      build-command: >-
        make build &&
        make check-generated &&
        go vet -tags 'integration envtest equivalence' ./...
      # envtest downloads a kube-apiserver and etcd; no cluster, no Docker.
      test-command: go test -race ./... && make test-envtest

  changes:
    name: Changes
    uses: blairham/.github/.github/workflows/go-changes.yml@9711060ad4860f35860bcbf90d90f103617082d2 # v0.0.1

  integration:
    name: PostgreSQL integration
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Run the generated SQL against PostgreSQL 16
        if: needs.changes.outputs.code == 'true'
        env:
          PGTEST_DSN: postgres://postgres:test@127.0.0.1:5433/postgres
        run: go test -race -tags integration ./internal/engine/postgres/ -v

  # Build only; a v* tag publishes (release.yml).
  image:
    name: Image
    needs: changes
    uses: blairham/.github/.github/workflows/go-image.yml@9711060ad4860f35860bcbf90d90f103617082d2 # v0.0.1
    with:
      run: ${{ needs.changes.outputs.code == 'true' }}

  # Lints the chart and renders it with each toggle flipped.
  charts:
    name: Helm chart
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: needs.changes.outputs.code == 'true'
      - name: Lint and render
        if: needs.changes.outputs.code == 'true'
        run: make helm-lint
