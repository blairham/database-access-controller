[[IgnoredVulns]]
id = "GO-2026-5932"
# golang.org/x/crypto/openpgp is deprecated, and this advisory covers every
# x/crypto version with no fixed release. x/crypto is here only as
# dbctl -> hashicorp/cli -> Masterminds/sprig -> x/crypto/bcrypt; no package
# in this module's build imports openpgp (`go list -deps ./...`), and
# govulncheck, which checks reachability, reports nothing.
reason = "x/crypto/openpgp is not imported by any package in the build; the advisory flags all x/crypto versions"
