{{/*
  GENERATED by hack/sync-chart.sh from config/rbac/role.yaml -- do not edit.
  Change the kubebuilder markers in the Go source and run `make generate`.
*/}}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "database-access-controller.fullname" . }}
  labels:
    {{- include "database-access-controller.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - database-access-controller.io
  resources:
  - databaseaccesses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - database-access-controller.io
  resources:
  - databaseaccesses/finalizers
  verbs:
  - update
- apiGroups:
  - database-access-controller.io
  resources:
  - databaseaccesses/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "database-access-controller.fullname" . }}
  labels:
    {{- include "database-access-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "database-access-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "database-access-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.enableLeaderElection }}
---
{{/*
  Leader election is namespaced and deliberately not part of the generated
  ClusterRole: the markers on the reconciler describe what it does to
  DatabaseAccess resources, not how the manager elects itself.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "database-access-controller.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "database-access-controller.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups:
      - ""
    resources:
      - events
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "database-access-controller.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "database-access-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "database-access-controller.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "database-access-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
