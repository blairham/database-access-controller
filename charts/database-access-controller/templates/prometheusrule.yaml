{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "database-access-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "database-access-controller.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: database-access-controller
      rules:
        {{- with .Values.prometheusRule.rules.notReady }}
        {{- if .enabled }}
        # `max by` collapses the old leader's lingering series after a failover.
        - alert: DatabaseAccessNotReady
          expr: max by (namespace, name) (database_access_controller_access_ready) == 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: "DatabaseAccess {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} is not Ready"
            description: >-
              The last reconcile failed for {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }}.
              The service may be missing database access. The reason is on the resource:
              kubectl -n {{ "{{" }} $labels.namespace {{ "}}" }} describe databaseaccess {{ "{{" }} $labels.name {{ "}}" }}
        {{- end }}
        {{- end }}
        {{- with .Values.prometheusRule.rules.stale }}
        {{- if .enabled }}
        # The resource has stopped being reconciled. Keyed on last_planned
        # because Observe resources never apply.
        - alert: DatabaseAccessStale
          expr: time() - max by (namespace, name) (database_access_controller_access_last_planned_timestamp_seconds) > {{ .thresholdSeconds }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: "DatabaseAccess {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} has not been reconciled in {{ "{{" }} $value | humanizeDuration {{ "}}" }}"
            description: >-
              The drift interval is one hour, so a healthy resource is planned against the database at least hourly.
              Check the controller's leader and logs, and the resource's Ready condition.
        {{- end }}
        {{- end }}
        {{- with .Values.prometheusRule.rules.notConverged }}
        {{- if .enabled }}
        # Pending statements that persist: a statement that keeps failing or
        # being undone, or an Observe resource not ready for cutover.
        - alert: DatabaseAccessNotConverged
          expr: max by (namespace, name) (database_access_controller_access_pending_statements) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: "DatabaseAccess {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} has {{ "{{" }} $value {{ "}}" }} pending statement(s)"
            description: >-
              The database does not match the spec. The pending statements are in the resource's status:
              kubectl -n {{ "{{" }} $labels.namespace {{ "}}" }} get databaseaccess {{ "{{" }} $labels.name {{ "}}" }} -o jsonpath='{.status.pending}'
        {{- end }}
        {{- end }}
{{- end }}
