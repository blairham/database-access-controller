{{- if .Values.autoscaling.enabled }}
{{/*
Autoscaling a leader-elected controller adds standbys, not throughput: exactly
one replica reconciles however many are running. Present for parity with the
chart layout this follows; leave it off unless you have a reason.
*/}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "database-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "database-controller.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "database-controller.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
