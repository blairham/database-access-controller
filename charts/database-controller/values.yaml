# Default values for database-controller.
#
# Layout and naming follow the aws-load-balancer-controller chart, so anyone
# who has configured that one finds the same keys in the same places.

replicaCount: 2
revisionHistoryLimit: 10

image:
  repository: ghcr.io/blairham/database-controller
  # Defaults to the chart's appVersion when unset. Pin a digest or an immutable
  # tag anywhere that matters -- a moving tag makes a rollout unreproducible.
  tag: ""
  pullPolicy: IfNotPresent

runtimeClassName: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

autoscaling:
  # Off, and it should stay off. Leader election means exactly one replica
  # reconciles regardless of how many are running, so scaling out adds standbys
  # rather than throughput. The key exists because the chart layout it follows
  # has it.
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account.
  #
  # On EKS this is where a Pod Identity Association or an IRSA role annotation
  # goes. The IAM role needs rds-db:connect on the admin user's dbuser ARN.
  # Nothing in the controller references AWS directly -- the SDK picks the
  # credentials up from the environment.
  annotations: {}
  # The name of the service account to use. Generated from the fullname
  # template when unset and create is true.
  name: ""

rbac:
  # Specifies whether rbac resources should be created
  create: true

crds:
  # Install the DatabaseAccess CRD as part of this release.
  #
  # ⚠ THIS CHART PUTS THE CRD IN templates/, NOT IN crds/, and that is a
  # deliberate departure from the chart it otherwise follows. Helm installs
  # crds/ once and then never upgrades or deletes it, so a schema change -- a
  # new field, a widened engine enum -- silently never reaches a cluster that
  # already has the chart, and the fix is a manual kubectl apply that someone
  # has to know to run. In templates/ the CRD upgrades with everything else.
  install: true

  # Keep the CRD when the release is uninstalled.
  #
  # Deleting a CRD deletes every DatabaseAccess with it, and each of those with
  # revokeOnDelete set would run its revoke plan -- an uninstall that withdraws
  # database access across the fleet. Leave this on.
  keep: true

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

terminationGracePeriodSeconds: 10

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

priorityClassName: system-cluster-critical

nodeSelector: {}
tolerations: []
affinity: {}

# Spread replicas across nodes when affinity is not set explicitly. With two
# replicas on one node a single eviction takes the standby with the leader.
configureDefaultAffinity: true

topologySpreadConstraints: []

updateStrategy: {}
  # type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 1
  #   maxUnavailable: 1

podDisruptionBudget: {}
#  maxUnavailable: 1

serviceAnnotations: {}
deploymentAnnotations: {}
podAnnotations: {}
podLabels: {}
additionalLabels: {}

# Which controllers this manager runs. An unrecognized name is refused at
# startup rather than silently running nothing.
controllers:
  - databaseaccess

# Restrict the manager to one namespace. Empty watches all namespaces.
watchNamespace: ""

# Leader election. Leave on whenever replicas can exceed one, including during
# a rollout: two managers reconciling one resource would race on the database.
enableLeaderElection: true

metrics:
  service:
    enabled: true
    port: 8080
  serviceMonitor:
    # Requires the Prometheus operator CRDs.
    enabled: false
    interval: 30s
    additionalLabels: {}

# Alerts on the per-resource metrics. Requires the Prometheus operator CRDs,
# and the metrics to be scraped (metrics.serviceMonitor above, or your own).
prometheusRule:
  enabled: false
  additionalLabels: {}
  rules:
    # database_controller_access_ready == 0: the last reconcile failed, so the
    # service may be missing access. 15m rides out a transient failure that the
    # work queue's backoff retry clears on its own.
    notReady:
      enabled: true
      for: 15m
      severity: critical
    # Not planned against the database for thresholdSeconds, in either mode
    # (last_planned, not last_applied: Observe never applies). The drift
    # interval is one hour, so 7200 is two missed drift passes.
    stale:
      enabled: true
      thresholdSeconds: 7200
      for: 10m
      severity: warning
    # pending_statements > 0 for `for`. 2h, not less: a fresh resource, or a
    # spec edit, legitimately shows pending until the next reconcile, and an
    # Enforce resource repairs drift within one drift interval, so only a
    # count that survives two passes means it is not converging. Off by
    # default: in Observe a non-zero count is expected until the cutover, and
    # whether that should page is a per-install decision.
    notConverged:
      enabled: false
      for: 2h
      severity: warning

# Log encoding: json for anything that ships logs, console for a local rig.
logEncoder: json
logLevel: info

# Extra arguments appended to the manager's command line.
extraArgs: []

# Extra environment variables on the manager container.
#
# This is how the AWS credential source is pointed somewhere other than the
# ambient one -- an EKS Pod Identity agent is discovered automatically, but a
# rig running a stand-in agent on loopback has to be told.
extraEnv: []
#  - name: AWS_CONTAINER_CREDENTIALS_FULL_URI
#    value: http://127.0.0.1:1338/v1/credentials

# Extra containers in the manager pod.
#
# The case this exists for is a credential agent. The AWS SDK refuses
# AWS_CONTAINER_CREDENTIALS_FULL_URI on anything but loopback, so an agent
# standing in for EKS Pod Identity cannot be its own Service -- it has to ride
# in this pod.
#
# ⚠ podSecurityContext APPLIES TO THESE TOO. With runAsNonRoot: true set at pod
# level, a sidecar whose image declares a non-numeric user fails with
# CreateContainerConfigError ("image has non-numeric user, cannot verify user
# is non-root") -- while the manager container starts and runs happily beside
# it, so the pod looks half-up rather than misconfigured. Give such a sidecar
# an explicit numeric runAsUser.
extraContainers: []

extraVolumes: []
extraVolumeMounts: []
