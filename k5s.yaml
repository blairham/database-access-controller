# Rig: the controller, installed by its Helm chart, against a real PostgreSQL
# in a kind cluster. It exercises the deployment (image, RBAC, leader election,
# probes); debug SQL with `make test-integration` instead.
#
#   k5s up -f k5s.yaml
#   make rig-install    # build, side-load into kind, helm upgrade --install
#   make rig-test       # apply examples/rig-databaseaccess.yaml, wait for Ready
#
# The rig uses password auth, so it does not exercise the IAM path.
apiVersion: k5s.dev/v1beta1
kind: Stack
name: database-access-controller
context: kind-k8s

services:
  postgres:
    # AWS's public mirror of Docker Hub.
    image: public.ecr.aws/docker/library/postgres:16-alpine
    ports:
      - 5432
    env:
      POSTGRES_USER: db_provisioner
      POSTGRES_PASSWORD: rigpassword
      POSTGRES_DB: appdb
      PGDATA: /var/lib/postgresql/data/pgdata
    readiness:
      exec:
        - pg_isready
        - -U
        - db_provisioner
        # Without -d, pg_isready targets a database named after the user and
        # floods the server log with FATALs while still passing.
        - -d
        - appdb
