# A service that owns its schema and runs its own migrations.
apiVersion: database-access-controller.io/v1alpha1
kind: DatabaseAccess
metadata:
  name: ingest
  namespace: ingest
spec:
  engine: postgres
  instance:
    endpoint: example.abc123.us-east-1.rds.amazonaws.com
    port: 5432
    database: appdb
    region: us-east-1
    adminUser: db_provisioner
    sslMode: verify-full
  role: ingest_app
  grantRdsIam: true
  grants:
    - schema: ingest
      privileges:
        - SELECT
        - INSERT
        - UPDATE
        - DELETE
      # The service runs its own migrations, so it owns the schema's objects.
      ownerOf: true
