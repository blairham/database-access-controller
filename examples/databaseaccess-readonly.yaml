# A read-only consumer of schemas another service owns. Default privileges are
# registered for every owning role, so objects added later stay readable.
apiVersion: database-controller.io/v1alpha1
kind: DatabaseAccess
metadata:
  name: reporting-ro
  namespace: reporting
spec:
  engine: postgres
  instance:
    endpoint: example.abc123.us-east-1.rds.amazonaws.com
    database: appdb
    region: us-east-1
  role: reporting_ro
  grantRdsIam: true
  grants:
    - schema: app
      privileges:
        - SELECT
    - schema: ingest
      privileges:
        - SELECT
