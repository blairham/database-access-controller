# A DatabaseAccess for the local rig.
#
# The only thing that differs from a production resource is the auth block: a
# PostgreSQL in a kind cluster has no IAM, so the admin connection uses a
# password from a Secret. Everything the controller does afterwards is the same
# code path production takes.
apiVersion: v1
kind: Secret
metadata:
  name: rig-admin-creds
  namespace: default
stringData:
  # Matches POSTGRES_PASSWORD in k5s.yaml.
  password: rigpassword
---
apiVersion: database-controller.io/v1alpha1
kind: DatabaseAccess
metadata:
  name: rig-app
  namespace: default
spec:
  engine: postgres
  instance:
    # The in-cluster Service name k5s gives the postgres service.
    endpoint: postgres
    port: 5432
    database: appdb
    region: us-east-1
    adminUser: db_provisioner
    # No TLS on a rig PostgreSQL.
    sslMode: disable
    auth:
      method: password
      passwordSecretRef:
        name: rig-admin-creds
        key: password
  role: app_role
  # False because THIS lane runs a plain PostgreSQL, which has only the pg_*
  # predefined roles -- rds_iam is created by RDS, so the grant would fail.
  #
  # Not a rule about rigs generally. A rig whose PostgreSQL is fronted by a
  # proxy that terminates RDS IAM auth may also create the role stub, and there
  # this can stay true, which is the production-faithful setting. The engine
  # checks for the role while planning either way, so a wrong answer here is a
  # clear refusal rather than a half-applied plan.
  grantRdsIam: false
  grants:
    - schema: app
      privileges:
        - USAGE
        - CREATE
        - SELECT
        - INSERT
        - UPDATE
        - DELETE
      ownerOf: true
