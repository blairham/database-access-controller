# A DatabaseAccess for the local rig (k5s.yaml), using password auth.
apiVersion: v1
kind: Secret
metadata:
  name: rig-admin-creds
  namespace: default
stringData:
  # Matches POSTGRES_PASSWORD in k5s.yaml.
  password: rigpassword
---
apiVersion: database-controller.io/v1alpha1
kind: DatabaseAccess
metadata:
  name: rig-app
  namespace: default
spec:
  engine: postgres
  instance:
    # The in-cluster Service name k5s gives the postgres service.
    endpoint: postgres
    port: 5432
    database: appdb
    adminUser: db_provisioner
    sslMode: disable
    auth:
      method: password
      passwordSecretRef:
        name: rig-admin-creds
        key: password
  role: app_role
  # A plain PostgreSQL has no rds_iam role.
  grantRdsIam: false
  grants:
    - schema: app
      privileges:
        - USAGE
        - CREATE
        - SELECT
        - INSERT
        - UPDATE
        - DELETE
      ownerOf: true
