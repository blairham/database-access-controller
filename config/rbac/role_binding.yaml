apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: database-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: database-controller
subjects:
  - kind: ServiceAccount
    name: database-controller
    namespace: database-controller-system
---
# Leader election needs its own Role in the controller's namespace: the
# ClusterRole above is generated from the kubebuilder markers on the reconciler
# and deliberately carries nothing about leases.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: database-controller-leader-election
  namespace: database-controller-system
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: database-controller-leader-election
  namespace: database-controller-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: database-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: database-controller
    namespace: database-controller-system
