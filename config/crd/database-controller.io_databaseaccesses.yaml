---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: databaseaccesses.database-controller.io
spec:
  group: database-controller.io
  names:
    kind: DatabaseAccess
    listKind: DatabaseAccessList
    plural: databaseaccesses
    shortNames:
    - dba
    singular: databaseaccess
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .spec.instance.database
      name: Database
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastAppliedTime
      name: Applied
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DatabaseAccess is the PostgreSQL role, schemas and grants one
          service needs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DatabaseAccessSpec declares the desired database state for
              one service.
            properties:
              engine:
                default: postgres
                description: |-
                  Engine is the database engine to provision against.

                  The field is explicit even while only one value is valid, so adding an
                  engine is an enum widening rather than a breaking change to a spec that
                  had assumed PostgreSQL all along.
                enum:
                - postgres
                type: string
              grantRdsIam:
                default: true
                description: |-
                  GrantRdsIam grants the rds_iam role to Role, so the SERVICE can
                  authenticate to the database with an IAM token instead of a password.

                  ⚠ THIS IS NOT HOW THE CONTROLLER AUTHENTICATES. That is
                  `instance.auth.method`, and the two are independent: the controller can
                  connect with a password to a real RDS instance and still grant rds_iam,
                  or connect with an IAM token and grant nothing.

                  The rds_iam role exists only on RDS and Aurora. Set this false against a
                  self-managed PostgreSQL, or the grant fails.
                type: boolean
              grants:
                description: Grants are the per-schema privileges.
                items:
                  description: SchemaGrant declares the privileges a role holds on
                    one schema.
                  properties:
                    ownerOf:
                      description: |-
                        OwnerOf makes the role the owner of the schema and of every relation in
                        it: tables, sequences, views and materialized views are reassigned.

                        Views matter and are easy to miss. Replacing a view requires ownership of
                        it, so a migration doing DROP VIEW / CREATE OR REPLACE VIEW fails with
                        "must be owner of view" even when every table it reads was reassigned
                        correctly.
                      type: boolean
                    privileges:
                      description: |-
                        Privileges granted on the schema and on the relations within it.

                        USAGE and CREATE apply to the schema itself. The remainder are granted ON
                        ALL TABLES, and the subset PostgreSQL accepts for sequences (SELECT,
                        UPDATE, USAGE) is granted ON ALL SEQUENCES. Passing INSERT here and
                        letting it reach the sequence grant is an error -- "invalid privilege type
                        INSERT for sequence" -- so the split is done for you.
                      items:
                        enum:
                        - SELECT
                        - INSERT
                        - UPDATE
                        - DELETE
                        - TRUNCATE
                        - REFERENCES
                        - TRIGGER
                        - USAGE
                        - CREATE
                        type: string
                      minItems: 1
                      type: array
                    schema:
                      description: |-
                        Schema is the PostgreSQL schema the privileges apply to. It is created if
                        it does not exist and OwnerOf is true.
                      minLength: 1
                      pattern: ^[a-z_][a-z0-9_]*$
                      type: string
                  required:
                  - privileges
                  - schema
                  type: object
                type: array
              instance:
                description: Instance is the RDS instance to provision on.
                properties:
                  adminUser:
                    default: db_provisioner
                    description: |-
                      AdminUser is the PostgreSQL role the controller connects as. It needs
                      CREATEROLE and enough membership to reassign ownership.
                    type: string
                  auth:
                    description: |-
                      Auth is how THE CONTROLLER authenticates as AdminUser.

                      ⚠ Not to be confused with `spec.grantRdsIam`, which grants the rds_iam
                      role to the service's own role. This field governs one connection: the
                      controller's.
                    properties:
                      method:
                        default: iam
                        description: Method is iam or password.
                        enum:
                        - iam
                        - password
                        type: string
                      passwordSecretRef:
                        description: |-
                          PasswordSecretRef points at the Secret holding the admin password. It is
                          required when Method is password and ignored otherwise. The Secret must
                          live in the same namespace as this resource -- a controller that could
                          read Secrets from any namespace on the say-so of a resource in one would
                          be a privilege-escalation path.
                        properties:
                          key:
                            default: password
                            description: Key within the Secret.
                            type: string
                          name:
                            description: Name of the Secret, in this resource's namespace.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: instance.auth.passwordSecretRef is required when auth.method
                        is password
                      rule: '!has(self.method) || self.method != ''password'' || has(self.passwordSecretRef)'
                  database:
                    default: appdb
                    description: Database is the database to connect to and grant
                      CONNECT on.
                    type: string
                  endpoint:
                    description: Endpoint is the instance's hostname.
                    minLength: 1
                    type: string
                  port:
                    default: 5432
                    description: Port is the PostgreSQL port.
                    format: int32
                    type: integer
                  region:
                    description: |-
                      Region is the AWS region, used to sign the IAM auth token. It is
                      required when the admin connection authenticates with IAM -- which is
                      the default -- and ignored entirely under password auth, where there is
                      no token to sign and the instance need not be in AWS at all.
                    minLength: 1
                    type: string
                  sslMode:
                    default: require
                    description: SSLMode is the libpq sslmode for the admin connection.
                    enum:
                    - disable
                    - require
                    - verify-ca
                    - verify-full
                    type: string
                required:
                - endpoint
                type: object
                x-kubernetes-validations:
                - message: instance.region is required unless instance.auth.method
                    is password
                  rule: (has(self.auth) && has(self.auth.method) && self.auth.method
                    == 'password') || (has(self.region) && size(self.region) > 0)
              revokeOnDelete:
                default: false
                description: |-
                  RevokeOnDelete drops the grants when this resource is deleted.

                  Defaults to false, and that default is deliberate: role-owned objects
                  break on DROP, so tearing down access is a decision a human makes with
                  the data in front of them.
                type: boolean
              role:
                description: Role is the per-service PostgreSQL role to create and
                  grant to.
                minLength: 1
                pattern: ^[a-z_][a-z0-9_]*$
                type: string
            required:
            - instance
            - role
            type: object
          status:
            description: DatabaseAccessStatus reports what the controller actually
              applied.
            properties:
              appliedPlanHash:
                description: |-
                  AppliedPlanHash fingerprints the statements applied on the last
                  successful reconcile.
                type: string
              conditions:
                description: |-
                  Conditions follow the standard Kubernetes condition contract. Ready is
                  true when the last reconcile applied every statement without a fatal
                  error.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastAppliedTime:
                description: LastAppliedTime is when that plan was applied.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  describes.
                format: int64
                type: integer
              statementsApplied:
                description: StatementsApplied counts the statements in the last applied
                  plan.
                type: integer
              warnings:
                description: |-
                  Warnings holds the best-effort statements that failed. These are not
                  fatal, but they are the difference between "access was granted" and
                  "access was granted and will survive the next migration", so they are
                  surfaced rather than buried in a pod log.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
